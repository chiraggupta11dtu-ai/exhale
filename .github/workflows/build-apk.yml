name: Build Exhale APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create the Android project
        run: |
          test -f index.html || { echo "index.html is missing. Upload it to the top of the repository."; exit 1; }
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "exhale",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.2.0",
              "@capacitor/cli": "^7.2.0",
              "@capacitor/core": "^7.2.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.exhale.breath",
            "appName": "Exhale",
            "webDir": "www",
            "android": { "adjustMarginsForEdgeToEdge": "force" }
          }
          EOF
          npm install --no-audit --no-fund
          npx cap telemetry off || true
          npx cap add android

      - name: Add the icon, vibration and keep-screen-on
        run: |
          pip install --quiet pillow
          cat > make_icons.py <<'PY'
          import os, glob, sys
          from PIL import Image, ImageDraw

          RES = sys.argv[1] if len(sys.argv) > 1 else "android/app/src/main/res"
          BG = (18, 48, 43, 255)
          TEAL = (92, 195, 181)
          SS = 4

          def layer(size, fn):
              im = Image.new("RGBA", size, (0, 0, 0, 0))
              fn(ImageDraw.Draw(im))
              return im

          def art(base, cx, cy, R):
              w = max(2, int(R * 0.07))
              base.alpha_composite(layer(base.size, lambda d: d.ellipse((cx-R, cy-R, cx+R, cy+R), outline=TEAL+(90,), width=w)))
              base.alpha_composite(layer(base.size, lambda d: d.arc((cx-R, cy-R, cx+R, cy+R), start=-90, end=45, fill=TEAL+(255,), width=w)))
              r2 = R * 0.80
              base.alpha_composite(layer(base.size, lambda d: d.ellipse((cx-r2, cy-r2, cx+r2, cy+r2), fill=TEAL+(40,))))
              r3 = R * 0.64
              base.alpha_composite(layer(base.size, lambda d: d.ellipse((cx-r3, cy-r3, cx+r3, cy+r3), fill=TEAL+(85,), outline=TEAL+(255,), width=max(2, int(R*0.05)))))

          def make(w, h, bg, frac):
              W, H = w * SS, h * SS
              base = Image.new("RGBA", (W, H), BG if bg else (0, 0, 0, 0))
              art(base, W / 2, H / 2, min(W, H) * frac)
              return base.resize((w, h), Image.LANCZOS)

          def round_mask(im):
              s = im.size[0]
              m = Image.new("L", (s*SS, s*SS), 0)
              ImageDraw.Draw(m).ellipse((0, 0, s*SS-1, s*SS-1), fill=255)
              m = m.resize((s, s), Image.LANCZOS)
              out = Image.new("RGBA", (s, s), (0, 0, 0, 0))
              out.paste(im, (0, 0), m)
              return out

          for d, s in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              folder = os.path.join(RES, "mipmap-" + d)
              os.makedirs(folder, exist_ok=True)
              sq = make(s, s, True, 0.36)
              sq.save(os.path.join(folder, "ic_launcher.png"))
              round_mask(sq).save(os.path.join(folder, "ic_launcher_round.png"))
              f = round(s * 2.25)
              make(f, f, False, 0.26).save(os.path.join(folder, "ic_launcher_foreground.png"))

          anydpi = os.path.join(RES, "mipmap-anydpi-v26")
          os.makedirs(anydpi, exist_ok=True)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '    <background android:drawable="@color/exhale_icon_bg"/>\n'
                 '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                 '</adaptive-icon>\n')
          for n in ("ic_launcher.xml", "ic_launcher_round.xml"):
              open(os.path.join(anydpi, n), "w").write(xml)

          values = os.path.join(RES, "values")
          os.makedirs(values, exist_ok=True)
          open(os.path.join(values, "exhale_colors.xml"), "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <color name="exhale_icon_bg">#12302B</color>\n</resources>\n')

          count = 0
          for p in glob.glob(os.path.join(RES, "drawable*", "splash.png")):
              w, h = Image.open(p).size
              make(w, h, True, 0.16).convert("RGB").save(p)
              count += 1
          print("Icons written; splash images replaced:", count)
          PY
          python make_icons.py android/app/src/main/res
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.VIBRATE" "$MANIFEST" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$MANIFEST"
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          [ -n "$MAIN" ] || MAIN=android/app/src/main/java/com/exhale/breath/MainActivity.java
          mkdir -p "$(dirname "$MAIN")"
          cat > "$MAIN" <<'EOF'
          package com.exhale.breath;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
          }
          EOF
          npx cap sync android

