      - uses: actions/upload-artifact@v4
        with:
          name: Exhale-apk
          path: Exhale.apk

      - name: Publish the APK as a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Exhale.apk \
            --title "Exhale (build ${{ github.run_number }})" \
            --notes "Download Exhale.apk below and open it on an Android phone to install." \
